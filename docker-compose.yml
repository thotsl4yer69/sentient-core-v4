version: '3.8'

services:
  # Sentient Core main service
  sentient-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentient-core:v4
    container_name: sentient-core
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./plugins:/app/plugins
    environment:
      - SENTIENT_CONFIG=/app/config/config.yaml
      - SENTIENT_LOG_LEVEL=INFO
      - SENTIENT_DEVICE=cpu
      - DATABASE_URL=postgresql://sentient:sentient_password@postgres:5432/sentient
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentient-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: sentient-postgres
    environment:
      - POSTGRES_DB=sentient
      - POSTGRES_USER=sentient
      - POSTGRES_PASSWORD=sentient_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentient"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentient-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: sentient-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentient-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentient-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sentient.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - tools
    networks:
      - sentient-network

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentient-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - tools
    networks:
      - sentient-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: sentient-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - sentient-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: sentient-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - sentient-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  sentient-network:
    driver: bridge
