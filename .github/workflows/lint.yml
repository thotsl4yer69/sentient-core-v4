name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint

    - name: Run flake8
      run: |
        flake8 sentient_core --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 sentient_core --count --max-complexity=15 --max-line-length=120 --statistics

    - name: Check code formatting with black
      run: |
        black --check sentient_core

    - name: Check import sorting with isort
      run: |
        isort --check-only sentient_core

    - name: Run mypy type checking
      run: |
        mypy sentient_core --ignore-missing-imports || true

    - name: Run pylint
      run: |
        pylint sentient_core --disable=C,R --max-line-length=120 || true
