# Sentient Core v4 - Raspberry Pi 5 + Hailo AI Hat Configuration

system:
  name: "Sentient Core v4 - Pi5/Hailo Node"
  version: "4.0.0"
  platform: "raspberry-pi-5"
  role: "fast_response"  # fast_response, deep_reasoning, coordinator
  log_level: "INFO"

# Node Configuration
node:
  node_id: "pi5-hailo-001"
  name: "Pi5 Fast Response Node"
  role: "fast_response"
  capabilities:
    - "fast_inference"
    - "vision_analysis"
    - "rf_monitoring"
    - "sensor_fusion"
    - "text_generation"
  hardware: "Raspberry Pi 5 + Hailo AI Hat"
  max_latency: 2.0  # seconds
  priority: 2

# Distributed Consciousness Configuration
distributed:
  enable: true
  sync_interval: 0.1  # 10Hz sync rate
  enable_discovery: false

  # Remote nodes (Jetson, other Pi's, etc.)
  remote_nodes:
    - node_id: "jetson-orin-001"
      name: "Jetson Deep Reasoning Node"
      role: "deep_reasoning"
      capabilities:
        - "multimodal"
        - "deep_reasoning"
        - "vision_analysis"
        - "text_generation"
      endpoint_url: "http://192.168.1.100:8000"  # Change to your Jetson IP
      hardware: "NVIDIA Jetson Orin Nano"
      model: "Qwen 2.5-VL-3B"
      max_latency: 5.0
      priority: 3

# Hardware Configuration
hardware:
  # Hailo AI Hat
  hailo:
    enabled: true
    device_id: "0"
    models:
      drone_detection: "~/.sentient_core/models/drone_detection.hef"
      # Add more Hailo models here

  # Google Coral TPU (optional)
  coral:
    enabled: false  # Set to true if Coral is connected
    device_id: "0"
    models:
      rf_classifier: "~/.sentient_core/models/rf_classifier_edgetpu.tflite"

  # GPIO/Sensors
  gpio:
    enabled: true
    i2c: true
    spi: true

# LLM Configuration (Local Qwen via llama.cpp)
llm:
  provider: "llamacpp"
  model_path: "~/.sentient_core/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  n_ctx: 2048
  n_threads: 4
  n_gpu_layers: 0  # CPU-only on Pi
  temperature: 0.7
  max_tokens: 512

# Cortana Persona Configuration
cortana:
  name: "Cortana"
  user_name: "Chief"  # Change to your name
  loyalty_mode: true
  emotional_intelligence: true
  tone: "professional_warm"

# Sensors Configuration
sensors:
  # RF Monitoring
  rf_monitor:
    enabled: true  # Set to false if no SDR hardware
    sample_rate: 2.4e6
    center_frequency: 2.4e9
    gain: 30

  # Vision/Camera
  camera:
    enabled: true
    resolution: [640, 480]
    fps: 30

  # Sensor Fusion
  fusion:
    enabled: true
    fusion_rate: 20  # Hz
    max_sensor_history: 100

# Health Monitoring
health_monitor:
  enabled: true
  update_interval: 5  # seconds
  cpu_threshold: 90  # %
  memory_threshold: 90  # %
  disk_threshold: 90  # %
  temp_threshold: 80  # °C

# Pixelscape Consciousness Renderer
pixelscape:
  consciousness_renderer:
    enabled: true
    display_width: 64
    display_height: 64
    render_fps: 30

# API Configuration
api:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  cors_enabled: true

# Storage Paths
storage:
  models_dir: "~/.sentient_core/models"
  data_dir: "~/.sentient_core/data"
  logs_dir: "~/.sentient_core/logs"
  cache_dir: "~/.sentient_core/cache"

# Memory System
memory:
  enabled: true
  backend: "redis"
  redis_url: "redis://localhost:6379"
  max_short_term: 100
  max_long_term: 10000

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "~/.sentient_core/logs/sentient_core.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Performance Tuning
performance:
  async_enabled: true
  thread_pool_size: 4
  max_concurrent_tasks: 10
